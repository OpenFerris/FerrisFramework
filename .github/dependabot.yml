version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/ferris-web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # Base images live in Dockerfile and compose.yaml; both must be watched so a
  # security tag does not wait for a manual bump (DX-35).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
