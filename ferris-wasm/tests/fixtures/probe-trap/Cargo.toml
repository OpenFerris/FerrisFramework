# Probe guest for the trap-recovery regression test (see
# ferris-wasm/tests/trap_recovery.rs). Not a workspace member: built on demand
# with
#   cargo build --target wasm32-wasip2 --manifest-path ferris-wasm/tests/fixtures/probe-trap/Cargo.toml
[package]
name = "probe-trap"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62"

[workspace]