[package]
name = "ferris-wasm"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Shared WASM component runtime for Ferris app plugins (WIT)"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
wasmtime = { version = "49", default-features = true }
wasmtime-wasi = { version = "49", default-features = true }
wasmtime-wasi-io = { version = "49" }
wit-component = { version = "=0.258.0" }
async-trait = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }
ferris-db = { path = "../../FerrisCore/ferris-db" }
ferris-core = { path = "../../FerrisCore/ferris-core" }
ferris-auth = { path = "../../FerrisCore/ferris-auth" }
ferris-document = { path = "../../FerrisCore/ferris-document" }
ferris-schema = { path = "../../FerrisCore/ferris-schema" }
ferris-jobs = { path = "../ferris-jobs" }
ferris-scheduler = { path = "../ferris-scheduler" }
redis = { workspace = true }

[dev-dependencies]
wat = "1"
wit-parser = "=0.258.0"
# The outbound-TLS test terminates a real handshake on loopback, so it needs a
# server side. Both crates are workspace dependencies already in the graph.
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
